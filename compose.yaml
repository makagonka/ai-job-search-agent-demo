services:
  demo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JOB_DEMO_DB: /service/data/jobs.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - demo_data:/service/data
    restart: unless-stopped
volumes:
  demo_data:
